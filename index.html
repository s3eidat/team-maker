<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Team Maker — Free Random Team Generator | S3eidat Tools</title>
<meta name="description" content="Split a list of names into random teams by number of teams or people per team. Optional skill balancing, fair crypto shuffle, team names, copy, download and print. Free and private.">
<meta property="og:title" content="Team Maker — split people into random teams">
<meta property="og:description" content="Fair random teams with optional skill balancing. Runs 100% in your browser.">
<meta property="og:image" content="screenshot.png">
<link rel="icon" href="kit/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="app.css">
<script src="kit/kit.js"></script>
</head>
<body data-tool="team-maker">
<main class="s3-main">
  <section class="s3-hero no-print">
    <h1>Team Maker</h1>
    <p>Paste a list of people and split them into fair, random teams. Add a skill level to anyone and the teams come out balanced.</p>
  </section>

  <div class="tm-grid">
    <section class="card no-print">
      <div class="row between"><h2>People <small id="count"></small></h2><button class="btn ghost small" id="clear">Clear</button></div>
      <label class="sr" for="names">People, one per line</label>
      <textarea class="textarea prose" id="names" dir="auto" placeholder="One name per line&#10;Add a skill level after a comma to balance teams:&#10;Ali, 5&#10;Sara, 3"></textarea>
      <p class="faint">Optional skill: <code>Name, 4</code> (any number 0–100; higher = stronger).</p>

      <div class="seg mt" id="mode" role="group" aria-label="Split by">
        <button aria-pressed="true" data-v="teams">Number of teams</button>
        <button aria-pressed="false" data-v="per">People per team</button>
      </div>
      <div class="grid-2 mt">
        <label class="field" id="numLabel">Teams<input class="input" type="number" id="num" min="2" max="100" value="2"></label>
        <label class="field">Team names
          <select class="select" id="naming">
            <option value="num">Team 1, Team 2…</option>
            <option value="colors">Colours</option>
            <option value="animals">Animals</option>
            <option value="letters">Team A, Team B…</option>
            <option value="custom">Custom…</option>
          </select>
        </label>
      </div>
      <label class="field mt" id="customWrap" hidden>Custom team names (one per line)<textarea class="textarea prose small-ta" id="custom" dir="auto"></textarea></label>
      <label class="check mt"><input type="checkbox" id="balance" checked> Balance teams by skill (when skills are given)</label>
      <div class="row mt">
        <button class="btn primary big" id="make">Make teams</button>
        <button class="btn big" id="reroll" disabled><svg class="i"><use href="#i-refresh"/></svg>Re-roll</button>
      </div>
    </section>

    <section class="card">
      <div class="row between no-print">
        <h2>Teams <small id="summary"></small></h2>
        <div class="row">
          <button class="btn small" id="copy"><svg class="i"><use href="#i-copy"/></svg>Copy</button>
          <button class="btn small" id="save"><svg class="i"><use href="#i-download"/></svg>.txt</button>
          <button class="btn small" id="print">Print</button>
        </div>
      </div>
      <div class="teams mt" id="teams"></div>
      <div class="empty" id="empty"><b>No teams yet</b>Add names on the left and press Make teams.</div>
    </section>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
